name: CompileForge CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Build e Test della UI (Frontend)
      working-directory: ./ui
      run: |
        npm ci
        npm run build

    - name: Prepara file .env per i container
      run: |
        echo "PORT=8080" >> .env.docker
        echo "HOST=0.0.0.0" >> .env.docker
        echo "DATABASE_URL=postgresql://admin:pass@my_postgres_db:5432/compileforge" >> .env.docker
        echo "REDIS_URL=redis://redis:6379" >> .env.docker
        echo "RABBITMQ_URL=amqp://admin:pass@rabbitmq:5672" >> .env.docker
        echo "API_KEY=test-api-key-123" >> .env.docker
        echo "METRICS_TOKEN=test-metrics-token" >> .env.docker
        echo "HOST_TMP_DIR=/tmp/compileforge_ci" >> .env.docker
        echo "HOST_TMP_DIR=/tmp/compileforge_ci" >> $GITHUB_ENV
        mkdir -p /tmp/compileforge_ci

    - name: Build dell'immagine del compilatore (Docker-in-Docker)
      run: docker build -t compiler-image ./compiler-image

    - name: Avvia infrastruttura con Docker Compose
      run: docker compose up -d --build db redis rabbitmq gateway worker

    - name: Attendi l'avvio dei servizi
      run: |
        echo "Attendendo che l'infrastruttura sia Healthy..."
        timeout 180 bash -c 'until curl --silent -f http://localhost:8080/health > /dev/null; do sleep 2; done'
        echo "Gateway e servizi pronti!"
        sleep 5

    - name: Esegui migrazioni Database
      run: |
        echo "Sincronizzando lo schema del database con Drizzle..."
        docker exec gateway npx drizzle-kit push --force

    - name: Test d'Integrazione End-to-End (E2E)
      run: |
        RESPONSE=$(curl -s -X POST http://localhost:8080/compile \
        -H "Content-Type: application/json" \
        -H "x-api-key: test-api-key-123" \
        -d '{
          "language": "c",
          "source_code": "int main() { return 0; }"
        }')
        JOB_ID=$(echo "$RESPONSE" | jq -r '.job_id')
        
        if [ -z "$JOB_ID" ] || [ "$JOB_ID" == "null" ]; then
          echo "Errore: Nessun job_id restituito."
          echo "Risposta Gateway: $RESPONSE"
          exit 1
        fi
        
        echo "Job inviato con successo. ID: $JOB_ID"
        
        MAX_ATTEMPTS=15
        ATTEMPT=1
        STATUS="pending"

        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          STATUS_RESP=$(curl -s -X GET http://localhost:8080/status/$JOB_ID \
            -H "x-api-key: test-api-key-123")
          STATUS=$(echo "$STATUS_RESP" | jq -r '.status')
          
          echo "Tentativo $ATTEMPT: Stato = $STATUS"
          
          if [ "$STATUS" = "completed" ]; then
            echo "Test E2E superato! Compilazione andata a buon fine."
            exit 0
          fi
          
          if [ "$STATUS" = "failed" ]; then
            echo "Test E2E fallito! La compilazione ha riportato un errore."
            echo "Dettagli: $STATUS_RESP"
            exit 1
          fi
          
          sleep 2
          ATTEMPT=$((ATTEMPT+1))
        done

        echo "Timeout: Il job non è passato allo stato 'completed' in tempo utile."
        exit 1

    - name: Stampa log di Docker in caso di errore
      if: failure()
      run: docker compose logs

    - name: Spegni infrastruttura e pulisci
      if: always()
      run: docker compose down -v