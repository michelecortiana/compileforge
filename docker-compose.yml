version: '3.8'
services:
  db: 
    image: postgres:16
    container_name: my_postgres_db
    environment: 
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: compileforge
    ports: 
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: pass
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq_enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  worker:
    build: ./worker
    container_name: worker
    ports:
      - "9090:9090"
    env_file:
      - .env.docker
    # 👇 NUOVO: Aggiunta variabile d'ambiente per il path host
    environment:
      HOST_TMP_DIR: ${PWD}/worker-tmp
    volumes:
      # Cruciale: permette al Worker di lanciare la compiler-image sull'host
      - /var/run/docker.sock:/var/run/docker.sock
      # 👇 NUOVO: Bind mount della cartella temporanea condivisa
      - ${PWD}/worker-tmp:/tmp/compileforge
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmq_data:
    driver: local
  redis-data:
    driver: local
  prometheus_data: {}
  grafana_data: {}