version: '3.8'
services:
  db: 
    image: postgres:16
    container_name: my_postgres_db
    environment: 
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: compileforge
    ports: 
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq   # <-- Fissa l'identità del nodo per Mnesia
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: pass
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # <-- Persistenza per code e messaggi
      - ./rabbitmq_enabled_plugins:/etc/rabbitmq/enabled_plugins:ro # <-- NUOVO: Abilita i plugin in modo nativo

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus # <-- Persistenza per lo storico metriche
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"

volumes:
  pgdata:
  rabbitmq_data:
    driver: local
  redis-data:
    driver: local
  prometheus_data: {}
  grafana_data: {}