services:
  db: 
    image: postgres:16
    container_name: my_postgres_db
    environment: 
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: compileforge
    ports: 
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d compileforge"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: pass
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq_enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./secrets/metrics_token.txt:/etc/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "127.0.0.1:3000:3000"

  gateway:
    build: ./gateway
    container_name: gateway
    restart: unless-stopped  
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy    
      redis:
        condition: service_healthy    
      rabbitmq:
        condition: service_healthy
    volumes:
      - shared_downloads:/app/downloads

  worker:
    build: ./worker
    container_name: worker
    restart: unless-stopped 
    ports:
      - "127.0.0.1:9090:9090"
    env_file:
      - .env.docker
    environment:
      HOST_TMP_DIR: ${HOST_TMP_DIR:-${PWD}/worker-tmp}
      PORT: "9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_TMP_DIR:-${PWD}/worker-tmp}:/tmp/compileforge
      - shared_downloads:/app/downloads
    depends_on:
      redis:
        condition: service_healthy    
      rabbitmq:
        condition: service_healthy
      db:                           
        condition: service_healthy
  
  ui:
    build:
      context: ./ui
      args:
        VITE_API_KEY: ${API_KEY}
        VITE_API_BASE_URL: http://localhost:8080
    container_name: ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      gateway:
        condition: service_healthy


volumes:
  pgdata:
  rabbitmq_data:
    driver: local
  redis-data:
    driver: local
  prometheus_data: {}
  grafana_data: {}
  shared_downloads: