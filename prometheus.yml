global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'gateway'
    bearer_token: 'super-segreto-prometheus-2026'
    static_configs:
      # Modificato: Usa il nome del container invece di host.docker.internal
      - targets: ['gateway:8080']

  - job_name: 'worker'
    bearer_token: 'super-segreto-prometheus-2026'
    static_configs:
      # Modificato: Usa il nome del container invece di host.docker.internal
      - targets: ['worker:9090']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']