global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'gateway'
    bearer_token_file: /etc/secrets/metrics_token
    static_configs:
      - targets: ['gateway:8080']

  - job_name: 'worker'
    bearer_token_file: /etc/secrets/metrics_token
    static_configs:
      - targets: ['worker:9090']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']