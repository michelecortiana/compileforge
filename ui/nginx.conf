server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file (e.g. /j/<uuid>
    # from the "share job" deep-linking feature) is served index.html so
    # React Router / pushState can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
